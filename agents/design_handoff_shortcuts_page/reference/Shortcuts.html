<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Mission Control — Shortcuts</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ── Mission Control tokens (mirrors globals.css) ───────────────── */
  :root, [data-theme="light"] {
    --color-bg:             #F5F5F5;
    --color-surface:        #EBEBEB;
    --color-surface-raised: #E3E3E3;
    --color-text-primary:   #141414;
    --color-text-secondary: #8C8C8C;
    --color-text-tertiary:  #B0B0B0;
    --color-accent:         #525252;
    --color-border:         #D8D8D8;
    --color-border-strong:  #C8C8C8;
    --color-code-bg:        #E5E5E5;
    --color-kbd-bg:         #E3E3E3;
    --color-row-hover:      rgba(20,20,20,0.035);
    --color-warn:           #9a6a2c;
  }
  [data-theme="dark"] {
    --color-bg:             #1C1C1C;
    --color-surface:        #252525;
    --color-surface-raised: #2C2C2C;
    --color-text-primary:   #EBEBEB;
    --color-text-secondary: #888888;
    --color-text-tertiary:  #5a5a5a;
    --color-accent:         #B0B0B0;
    --color-border:         #353535;
    --color-border-strong:  #454545;
    --color-code-bg:        #252525;
    --color-kbd-bg:         #2c2c2c;
    --color-row-hover:      rgba(255,255,255,0.035);
    --color-warn:           #c4a36a;
  }

  html, body {
    margin: 0; padding: 0;
    background: #0d0d0d;
    color: #ebebeb;
    font-family: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace; }

  /* ── Page chrome ────────────────────────────────────────────────── */
  .page {
    max-width: 1440px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }
  .page-h {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 24px; margin-bottom: 8px;
  }
  .page-h h1 {
    margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em;
    color: #ebebeb;
  }
  .page-h .meta {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #6e6e6e;
  }
  .page-sub {
    color: #8a8a8a; font-size: 13px; max-width: 720px; margin: 0 0 28px;
    line-height: 1.55;
  }
  .demo-toggle {
    display: inline-flex; gap: 4px; padding: 3px;
    background: #161616; border: 1px solid #252525; border-radius: 8px;
    margin-bottom: 24px;
  }
  .demo-toggle button {
    appearance: none; border: 0; background: transparent;
    color: #8a8a8a; font: inherit; font-size: 12px;
    padding: 5px 12px; border-radius: 5px; cursor: pointer;
    font-family: "JetBrains Mono", monospace;
  }
  .demo-toggle button.active {
    background: #2c2c2c; color: #ebebeb;
  }

  /* ── App window frame ───────────────────────────────────────────── */
  .app-window {
    width: 100%;
    height: 760px;
    background: var(--color-bg);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--color-border);
    color: var(--color-text-primary);
    display: flex; flex-direction: column;
  }
  .app-titlebar {
    height: 36px; flex-shrink: 0;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center;
    padding: 0 14px;
    gap: 12px;
    font-size: 12px; color: var(--color-text-secondary);
  }
  .app-titlebar .traffic { display: flex; gap: 6px; }
  .app-titlebar .traffic span {
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--color-border-strong);
  }
  .app-titlebar .title { font-weight: 500; color: var(--color-text-primary); }
  .app-titlebar .spacer { flex: 1; }

  .app-body { flex: 1; display: flex; min-height: 0; }
  .app-sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    padding: 16px 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px;
    font-size: 13px; color: var(--color-text-secondary);
    cursor: default;
  }
  .nav-item.active {
    background: var(--color-surface-raised);
    color: var(--color-text-primary);
  }
  .nav-item .nav-ic {
    width: 16px; height: 16px;
    color: currentColor;
    display: grid; place-items: center;
  }
  .nav-item .nav-count {
    margin-left: auto;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; color: var(--color-text-tertiary);
  }
  .nav-section-h {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--color-text-tertiary);
    padding: 14px 10px 4px;
  }
  .settings-chip {
    margin-top: auto;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    font-size: 13px; color: var(--color-text-primary);
  }
  .settings-chip .badge {
    width: 22px; height: 22px; border-radius: 6px;
    background: var(--color-border);
    display: grid; place-items: center;
    color: var(--color-text-secondary);
  }
  .settings-chip .sp { flex: 1; }

  .app-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }

  /* ── Shortcuts page ─────────────────────────────────────────────── */
  .sc-header {
    padding: 22px 32px 12px;
    display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--color-border);
  }
  .sc-header .titles { flex: 1; min-width: 0; }
  .sc-header h2 {
    margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
  }
  .sc-header .sub {
    margin-top: 2px;
    font-size: 12px; color: var(--color-text-secondary);
  }
  .sc-header .actions { display: flex; align-items: center; gap: 8px; }

  /* Search input */
  .sc-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 7px 10px;
    width: 220px;
    color: var(--color-text-secondary);
    transition: border-color .12s, background .12s;
  }
  .sc-search:focus-within {
    border-color: var(--color-border-strong);
    background: var(--color-surface-raised);
  }
  .sc-search input {
    flex: 1; border: 0; background: transparent; outline: 0;
    font: inherit; font-size: 13px; color: var(--color-text-primary);
    min-width: 0;
  }
  .sc-search input::placeholder { color: var(--color-text-secondary); }
  .sc-search .kbd-hint {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--color-text-tertiary);
    padding: 1px 5px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
  }

  /* Primary action button */
  .sc-btn-primary {
    appearance: none; border: 1px solid var(--color-border-strong);
    background: var(--color-text-primary);
    color: var(--color-bg);
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 7px 12px; border-radius: 8px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: opacity .12s;
  }
  .sc-btn-primary:hover { opacity: 0.88; }
  .sc-btn-primary .plus { font-size: 14px; line-height: 1; }

  .sc-btn-ghost {
    appearance: none; border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-primary);
    font: inherit; font-size: 13px;
    padding: 7px 12px; border-radius: 8px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, border-color .12s;
  }
  .sc-btn-ghost:hover {
    background: var(--color-surface-raised);
    border-color: var(--color-border-strong);
  }

  /* Filter chips */
  .sc-filters {
    padding: 12px 32px;
    display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid var(--color-border);
  }
  .chip {
    appearance: none; border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-text-secondary);
    font: inherit; font-size: 12px;
    padding: 5px 10px; border-radius: 999px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s, border-color .12s, color .12s;
  }
  .chip:hover { color: var(--color-text-primary); border-color: var(--color-border-strong); }
  .chip.active {
    background: var(--color-surface-raised);
    color: var(--color-text-primary);
    border-color: var(--color-border-strong);
  }
  .chip .count {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--color-text-tertiary);
    margin-left: 2px;
  }
  .chip.active .count { color: var(--color-text-secondary); }

  /* Scrollable list */
  .sc-list {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 0 16px 24px;
  }
  .sc-list::-webkit-scrollbar { width: 8px; }
  .sc-list::-webkit-scrollbar-thumb {
    background: var(--color-border); border-radius: 4px;
  }

  /* Inline new-shortcut panel (slides down at top of list).
     3-col grid: Category | Action | Value on top row.
                 Shortcut | Scope  | Actions on bottom row. */
  .new-panel {
    margin: 14px 16px 6px;
    border: 1px solid var(--color-border-strong);
    background: var(--color-surface);
    border-radius: 12px;
    padding: 14px;
    display: grid;
    grid-template-columns: 1fr 1.25fr 1.25fr;
    grid-template-areas:
      "category  action    value"
      "shortcut  scope     actions"
      "warn      warn      warn";
    gap: 12px 14px;
    align-items: end;
    animation: panelIn .18s cubic-bezier(.2,.7,.3,1);
  }
  .new-panel .f-category { grid-area: category; }
  .new-panel .f-action   { grid-area: action; }
  .new-panel .f-value    { grid-area: value; }
  .new-panel .f-shortcut { grid-area: shortcut; }
  .new-panel .f-scope    { grid-area: scope; }
  .new-panel .f-actions  { grid-area: actions; display: flex; gap: 8px; justify-content: flex-end; align-items: end; }
  .new-panel .conflict-msg { grid-area: warn; }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field .label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--color-text-secondary);
  }
  .field .control {
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--color-text-primary);
    display: flex; align-items: center; gap: 8px;
    min-height: 34px;
    box-sizing: border-box;
  }
  .field select.control,
  .field input.control {
    appearance: none;
    font-family: inherit;
    width: 100%;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--color-text-secondary) 50%),
      linear-gradient(135deg, var(--color-text-secondary) 50%, transparent 50%);
    background-position:
      calc(100% - 14px) 50%,
      calc(100% - 10px) 50%;
    background-size: 4px 4px;
    background-repeat: no-repeat;
    padding-right: 26px;
  }
  .field input.control {
    background-image: none;
    padding-right: 10px;
  }

  /* Keybind capture field */
  .capture {
    background: var(--color-surface-raised);
    border: 1px dashed var(--color-border-strong);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--color-text-primary);
    display: flex; align-items: center; gap: 8px;
    min-height: 34px;
    box-sizing: border-box;
    cursor: pointer;
    transition: border-color .12s, background .12s;
  }
  .capture:hover { border-color: var(--color-accent); }
  .capture.recording {
    border-style: solid;
    border-color: var(--color-text-primary);
    background: var(--color-bg);
  }
  .capture .placeholder { color: var(--color-text-secondary); }
  .capture .rec-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--color-text-primary);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .capture.conflict { border-color: var(--color-warn); }
  .conflict-msg {
    grid-column: 1 / -1;
    font-size: 11px;
    color: var(--color-warn);
    display: flex; align-items: center; gap: 6px;
  }

  /* KBD pill */
  .kbd {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; font-weight: 500;
    background: var(--color-kbd-bg);
    border: 1px solid var(--color-border);
    border-bottom-width: 1.5px;
    border-radius: 5px;
    padding: 2px 6px;
    color: var(--color-text-primary);
    line-height: 1;
    display: inline-flex; align-items: center; height: 19px;
    min-width: 19px;
    justify-content: center;
    box-sizing: border-box;
  }
  .kbd.unset {
    color: var(--color-text-secondary);
    border-style: dashed;
    background: transparent;
  }
  .kbd-plus {
    color: var(--color-text-tertiary);
    font-size: 11px;
    margin: 0 1px;
    font-family: "JetBrains Mono", monospace;
  }

  /* Group header */
  .sc-group-h {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 16px 6px;
    position: sticky; top: 0;
    background: linear-gradient(to bottom, var(--color-bg) 88%, transparent);
    z-index: 1;
  }
  .sc-group-h .gicon {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--color-surface-raised);
    color: var(--color-text-primary);
    display: grid; place-items: center;
  }
  .sc-group-h h3 {
    margin: 0; font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--color-text-primary);
  }
  .sc-group-h .count {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--color-text-secondary);
  }
  .sc-group-h .rule {
    flex: 1; height: 1px; background: var(--color-border);
  }

  /* Shortcut row */
  .sc-row {
    display: grid;
    grid-template-columns: 28px 1fr auto 36px 28px;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    margin: 1px 0;
    border-radius: 8px;
    cursor: default;
    border: 1px solid transparent;
  }
  .sc-row:hover {
    background: var(--color-row-hover);
  }
  .sc-row.editing {
    background: var(--color-surface);
    border-color: var(--color-border-strong);
  }
  .sc-row .row-ic {
    width: 28px; height: 28px;
    border-radius: 7px;
    background: var(--color-surface);
    color: var(--color-text-primary);
    display: grid; place-items: center;
  }
  .sc-row .row-body { min-width: 0; }
  .sc-row .row-title {
    font-size: 13px; font-weight: 500;
    color: var(--color-text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sc-row .row-meta {
    font-size: 11px; color: var(--color-text-secondary);
    margin-top: 1px;
    display: flex; gap: 8px; align-items: center;
    font-family: "JetBrains Mono", monospace;
    letter-spacing: 0.02em;
  }
  .sc-row .row-meta .pipe { color: var(--color-text-tertiary); }
  .sc-row .row-keys {
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: background .12s;
  }
  .sc-row .row-keys:hover {
    background: var(--color-surface);
  }
  .sc-row.editing .row-keys { background: transparent; }
  .sc-row .row-keys.capturing {
    border: 1px solid var(--color-text-primary);
    background: var(--color-bg);
    padding: 3px 6px;
  }
  .sc-row.disabled .row-title { color: var(--color-text-secondary); }
  .sc-row.disabled .kbd { opacity: 0.45; }
  .sc-row.disabled .row-ic { opacity: 0.5; }

  /* Toggle switch */
  .toggle {
    appearance: none; border: 0; padding: 0; cursor: pointer;
    width: 32px; height: 18px;
    background: var(--color-border);
    border-radius: 999px;
    position: relative;
    transition: background .15s;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 999px;
    background: var(--color-bg);
    transition: transform .15s;
  }
  [data-theme="dark"] .toggle::after { background: #d0d0d0; }
  .toggle.on { background: var(--color-text-primary); }
  .toggle.on::after { transform: translateX(14px); }

  /* More button */
  .more {
    appearance: none; border: 0; background: transparent;
    color: var(--color-text-secondary);
    cursor: pointer;
    width: 28px; height: 28px; border-radius: 6px;
    display: grid; place-items: center;
    transition: background .12s, color .12s;
  }
  .more:hover {
    background: var(--color-surface-raised);
    color: var(--color-text-primary);
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 56px 24px;
    color: var(--color-text-secondary);
  }
  .empty h4 { color: var(--color-text-primary); margin: 0 0 4px; font-size: 14px; font-weight: 500; }
  .empty p { margin: 0; font-size: 12px; max-width: 320px; margin-inline: auto; line-height: 1.5; }

  /* Spec annotation chips, used outside the app window */
  .annot {
    margin-top: 32px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .annot .card {
    background: #161616;
    border: 1px solid #252525;
    border-radius: 10px;
    padding: 16px 16px 18px;
  }
  .annot .card h5 {
    margin: 0 0 6px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8a8a; font-weight: 500;
  }
  .annot .card p {
    margin: 0; font-size: 12px; color: #c0c0c0; line-height: 1.55;
  }

  /* Custom dropdown ─────────────────────────────────────────────── */
  .dropdown {
    position: relative;
    width: 100%;
  }
  .dropdown-trigger {
    width: 100%;
    appearance: none;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    color: var(--color-text-primary);
    font: inherit; font-size: 13px;
    padding: 7px 10px;
    border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
    min-height: 34px;
    box-sizing: border-box;
    cursor: pointer;
    text-align: left;
    transition: border-color .12s, background .12s;
  }
  .dropdown-trigger:hover { border-color: var(--color-border-strong); }
  .dropdown-trigger:disabled { opacity: 0.45; cursor: not-allowed; }
  .dropdown-trigger.open {
    border-color: var(--color-text-primary);
    background: var(--color-bg);
  }
  .dropdown-trigger .dd-pre,
  .dropdown-trigger .dd-icon {
    color: var(--color-text-secondary);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .dropdown-trigger.open .dd-icon,
  .dropdown-trigger.open .dd-pre { color: var(--color-text-primary); }
  .dropdown-trigger .dd-label {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dropdown-trigger .dd-label.placeholder { color: var(--color-text-secondary); }
  .dropdown-trigger .dd-sub-inline {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--color-text-secondary);
    padding: 1px 5px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    flex-shrink: 0;
    text-transform: lowercase;
  }
  .dropdown-trigger > svg:last-child {
    color: var(--color-text-secondary);
    transition: transform .15s;
    flex-shrink: 0;
  }
  .dropdown-trigger.open > svg:last-child { transform: rotate(180deg); }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 100%;
    width: max-content;
    max-width: 360px;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border-strong);
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35),
                0 1px 0 rgba(255,255,255,0.03) inset;
    z-index: 20;
    max-height: 260px;
    overflow-y: auto;
    padding: 4px;
    animation: ddIn .14s cubic-bezier(.2,.7,.3,1);
  }
  [data-theme="light"] .dropdown-menu {
    box-shadow: 0 10px 28px rgba(0,0,0,0.10),
                0 1px 0 rgba(255,255,255,0.6) inset;
  }
  @keyframes ddIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .dropdown-menu::-webkit-scrollbar { width: 6px; }
  .dropdown-menu::-webkit-scrollbar-thumb {
    background: var(--color-border); border-radius: 3px;
  }
  .dropdown-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px;
    border-radius: 6px;
