appId: com.missioncontrol.app
productName: Mission Control
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - node_modules/**/*
  - package.json
  - '!node_modules/.cache'
  - '!**/*.map'

win:
  executableName: MissionControl
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
