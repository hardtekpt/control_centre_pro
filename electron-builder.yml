appId: "com.control-centre-pro"
productName: "Control Centre Pro"
directories:
  buildResources: resources
files:
  - out
  - resources
win:
  icon: "resources/mission-control-terracotta-1024.png"
asarUnpack:
  - "**/node_modules/naudiodon2/**"
extraResources:
  - from: "resources/MultiMonitorTool.exe"
    to: "MultiMonitorTool.exe"
  # Tray icon must live on disk at process.resourcesPath (not inside app.asar)
  # because createTray() resolves it there in packaged builds — see src/main/index.ts
  - from: "resources/tray-icon.png"
    to: "tray-icon.png"
  # Python subprocess services must live on disk (outside app.asar) so the main
  # process can spawn them at process.resourcesPath/services — see serviceManager.servicesDir()
  - from: "resources/services"
    to: "services"
  # Bundled, relocatable Python runtime with the steelseries_gg / arctis_hid
  # packages pre-installed. Built in CI (see .github/workflows/release.yml) and
  # spawned at process.resourcesPath/python/python.exe — see serviceManager.bundledPythonPath()
  - from: "resources/python"
    to: "python"
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
buildDependenciesFromSource: false
publish:
  provider: github
  releaseType: release
